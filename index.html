<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLB Vovinam Nhân Văn | Bio Links</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Google Fonts: Inter & Montserrat for Martial Arts typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vovinam: {
                            blue: '#0052cc',
                            darkBlue: '#002663',
                            deepBackground: '#020b18',
                            yellow: '#ffcc00',
                            red: '#e60000',
                            lightBlue: '#1e88e5'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #020b18;
            background-image: 
                radial-gradient(at 50% 0%, rgba(0, 82, 204, 0.35) 0px, transparent 75%),
                radial-gradient(at 100% 100%, rgba(230, 0, 0, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 204, 0, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism effects */
        .glass-card {
            background: rgba(8, 25, 53, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Vovinam Crest Glow */
        .crest-glow {
            box-shadow: 0 0 35px rgba(0, 136, 255, 0.5), 0 0 15px rgba(255, 204, 0, 0.4);
        }

        /* Metallic Sheen Effect on Hover */
        .shine-effect {
            position: relative;
            overflow: hidden;
        }
        .shine-effect::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 20%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.3) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(30deg);
            transition: all 0.75s ease;
        }
        .shine-effect:hover::after {
            left: 140%;
        }

        /* Pulse glow animation for buttons */
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(0, 82, 204, 0.4); }
            50% { box-shadow: 0 0 25px rgba(0, 136, 255, 0.7); }
        }
        .pulse-glow-fb {
            animation: pulseGlow 3s infinite;
        }

        @keyframes pulseGlowTikTok {
            0%, 100% { box-shadow: 0 0 15px rgba(254, 44, 85, 0.3); }
            50% { box-shadow: 0 0 25px rgba(37, 244, 238, 0.5); }
        }
        .pulse-glow-tt {
            animation: pulseGlowTikTok 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="text-slate-100 font-sans flex flex-col justify-between min-h-screen px-4 py-8 antialiased selection:bg-vovinam-yellow selection:text-black">

    <main class="w-full max-w-md mx-auto flex-grow flex flex-col items-center">
        
        <!-- TOP TOOLBAR: SHARE & INFO BUTTONS -->
        <div class="w-full flex justify-between items-center mb-6">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase bg-blue-950/80 text-sky-300 border border-sky-500/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Vovinam Nhân Văn Official
            </span>
            <button onclick="shareProfile()" 
                    class="w-9 h-9 rounded-full glass-button flex items-center justify-center text-slate-200 hover:text-vovinam-yellow hover:border-vovinam-yellow transition-all duration-300 active:scale-95 shadow-lg"
                    title="Chia sẻ trang">
                <i class="fa-solid fa-share-nodes text-sm"></i>
            </button>
        </div>

        <!-- VOVINAM BRANDING CREST & LOGO -->
        <div class="text-center flex flex-col items-center mb-8 relative">
            <!-- Glowing Logo Frame -->
            <div class="relative group cursor-pointer mb-5">
                <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-vovinam-yellow via-vovinam-blue to-vovinam-red p-1.5 crest-glow transition-transform duration-500 group-hover:scale-105">
                    <div class="w-full h-full bg-slate-950 rounded-full flex flex-col items-center justify-center overflow-hidden relative border border-white/20">
                        <!-- Official CLB Vovinam Nhan Van Logo Image -->
                        <img src="logo.png" 
                             alt="CLB Vovinam Nhân Văn Logo" 
                             class="w-full h-full object-cover rounded-full z-10 transition-transform duration-500 group-hover:scale-110"
                             onerror="this.onerror=null; this.src='https://placehold.co/200x200/ffcc00/002663?text=VOVINAM+NHAN+VAN';">
                        <!-- Background Accent Lines -->
                        <div class="absolute inset-0 bg-gradient-to-b from-vovinam-blue/20 to-vovinam-darkBlue/60"></div>
                    </div>
                </div>
                <!-- Badge -->
                <!-- <span class="absolute -bottom-1 bg-gradient-to-r from-vovinam-red to-rose-600 text-white text-[10px] font-black tracking-wider px-3 py-0.5 rounded-full uppercase border border-white/30 shadow-md z-20">
                    Nhân - Võ - Ái
                </span> -->
            </div>

            <!-- Title & Motto -->
            <h1 class="text-2xl sm:text-3xl font-black font-display tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-white to-sky-300 uppercase drop-shadow-sm">
                CLB VOVINAM NHÂN VĂN
            </h1>
            <p class="text-xs sm:text-sm font-semibold text-sky-200/90 mt-2 px-4 py-1.5 rounded-full glass-card border border-sky-400/20 italic tracking-wide">
                <i class="fa-solid fa-quote-left text-[10px] text-vovinam-yellow mr-1"></i>
                Việt Võ Đạo - Bàn Tay Thép Với Trái Tim Từ Ái
                <i class="fa-solid fa-quote-right text-[10px] text-vovinam-yellow ml-1"></i>
            </p>
        </div>

        <div class="w-full space-y-4 mb-8">
            
            <!-- FACEBOOK FANPAGE LINK CARD -->
            <a id="btn-facebook" 
               href="https://www.facebook.com/share/1dmUXcXr8P/" 
               target="_blank" 
               rel="noopener noreferrer"
               onclick="trackClick('facebook')"
               class="group relative flex items-center justify-between p-4 rounded-2xl glass-button hover:bg-gradient-to-r hover:from-blue-600 hover:to-blue-700 transition-all duration-300 transform hover:-translate-y-1.5 active:scale-[0.98] shine-effect pulse-glow-fb border border-blue-400/30">
                <div class="flex items-center space-x-4">
                    <div class="w-13 h-13 w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white text-2xl group-hover:bg-white group-hover:text-blue-600 transition-all duration-300 shadow-md flex-shrink-0">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-bold text-base sm:text-lg text-white group-hover:text-white leading-tight">
                            FACEBOOK FANPAGE
                        </span>
                        <span class="text-xs text-slate-300 group-hover:text-blue-100 mt-0.5 block">
                            Cập nhật thông báo & lịch tập CLB
                        </span>
                    </div>
                </div>
                <div class="flex flex-col items-end pl-2">
                    <div class="w-8 h-8 rounded-full bg-white/10 group-hover:bg-white/20 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-sky-200 group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                    <span id="clicks-facebook" class="text-[10px] font-medium text-sky-300/80 mt-1">0 clicks</span>
                </div>
            </a>

            <!-- TIKTOK CLB LINK CARD -->
            <a id="btn-tiktok" 
               href="https://www.tiktok.com/@vovinamnhanvan?_r=1&_t=ZS-9APg6LjOexw" 
               target="_blank" 
               rel="noopener noreferrer"
               onclick="trackClick('tiktok')"
               class="group relative flex items-center justify-between p-4 rounded-2xl glass-button hover:bg-gradient-to-r hover:from-slate-900 hover:via-black hover:to-rose-950 transition-all duration-300 transform hover:-translate-y-1.5 active:scale-[0.98] shine-effect pulse-glow-tt border border-pink-500/30">
                <div class="flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-white text-2xl group-hover:border-pink-500 group-hover:bg-pink-600 transition-all duration-300 shadow-md flex-shrink-0">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <div class="text-left">
                        <span class="block font-bold text-base sm:text-lg text-white group-hover:text-white leading-tight">
                            TIKTOK CLB
                        </span>
                        <span class="text-xs text-slate-300 group-hover:text-pink-200 mt-0.5 block">
                            Xem video đồng phô, quyền & đòn chân
                        </span>
                    </div>
                </div>
                <div class="flex flex-col items-end pl-2">
                    <div class="w-8 h-8 rounded-full bg-white/10 group-hover:bg-white/20 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs text-pink-200 group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform"></i>
                    </div>
                    <span id="clicks-tiktok" class="text-[10px] font-medium text-pink-300/80 mt-1">0 clicks</span>
                </div>
            </a>

        </div>

        

        

    </main>

    <footer class="w-full max-w-md mx-auto text-center py-4 text-xs text-slate-400 border-t border-white/10 flex flex-col items-center gap-1">
        <div class="flex items-center gap-2 text-vovinam-yellow font-medium">
            <i class="fa-solid fa-shield-halved text-xs"></i>
            <span>Vovinam Việt Võ Đạo</span>
        </div>
        <p class="text-[11px] text-slate-400">© 2026 CLB VOVINAM NHÂN VĂN</p>
    </footer>

    <script>
        // Links mặc định cung cấp từ người dùng
        const DEFAULT_LINKS = {
            facebook: "https://www.facebook.com/share/1dmUXcXr8P/",
            tiktok: "https://www.tiktok.com/@vovinamnhanvan?_r=1&_t=ZS-9APg6LjOexw"
        };

        // State lưu trữ số lượt nhấp
        let clickStats = { facebook: 0, tiktok: 0 };

        // Khởi chạy khi tải trang
        window.addEventListener('DOMContentLoaded', () => {
            initLinks();
            initClickStats();
        });

        // Nạp link từ localStorage hoặc gán mặc định
        function initLinks() {
            const currentFb = localStorage.getItem('vovinam_fb_link') || DEFAULT_LINKS.facebook;
            const currentTt = localStorage.getItem('vovinam_tt_link') || DEFAULT_LINKS.tiktok;

            document.getElementById('btn-facebook').href = currentFb;
            document.getElementById('btn-tiktok').href = currentTt;

            document.getElementById('input-facebook').value = currentFb;
            document.getElementById('input-tiktok').value = currentTt;
        }

        // Tải số lượt click đã lưu
        function initClickStats() {
            const saved = localStorage.getItem('vovinam_click_stats');
            if (saved) {
                try {
                    clickStats = JSON.parse(saved);
                } catch(e) {
                    console.error("Lỗi đọc dữ liệu click", e);
                }
            }
            renderClickUI();
        }

        // Đếm click khi bấm vào link
        function trackClick(type) {
            clickStats[type] = (clickStats[type] || 0) + 1;
            localStorage.setItem('vovinam_click_stats', JSON.stringify(clickStats));
            renderClickUI();
        }

        // Cập nhật số click hiển thị trên UI
        function renderClickUI() {
            document.getElementById('clicks-facebook').innerText = `${clickStats.facebook || 0} lượt nhấp`;
            document.getElementById('clicks-tiktok').innerText = `${clickStats.tiktok || 0} lượt nhấp`;
        }

        // Toggle hiển thị bảng quản trị
        function toggleSettings() {
            const panel = document.getElementById('settings-panel');
            panel.classList.toggle('hidden');
        }

        // Lưu đường dẫn tùy chỉnh
        function saveCustomLinks() {
            const fbUrl = document.getElementById('input-facebook').value.trim();
            const ttUrl = document.getElementById('input-tiktok').value.trim();

            if (fbUrl) localStorage.setItem('vovinam_fb_link', fbUrl);
            if (ttUrl) localStorage.setItem('vovinam_tt_link', ttUrl);

            initLinks();
            toggleSettings();
            showToast('Đã lưu cấu hình đường dẫn mới!');
        }

        // Khôi phục về link mặc định ban đầu
        function resetToDefaults() {
            localStorage.removeItem('vovinam_fb_link');
            localStorage.removeItem('vovinam_tt_link');
            clickStats = { facebook: 0, tiktok: 0 };
            localStorage.setItem('vovinam_click_stats', JSON.stringify(clickStats));
            
            initLinks();
            renderClickUI();
            toggleSettings();
            showToast('Đã khôi phục link mặc định!');
        }

       

        // Chia sẻ trang qua Web Share API nếu trình duyệt hỗ trợ
        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: 'CLB Vovinam Nhân Văn - Link Bio',
                    text: 'Kết nối với CLB Vovinam Nhân Văn qua Facebook & TikTok chính thức!',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                copyPageLink();
            }
        }

        // Hiển thị Toast thông báo ngắn
        function showToast(message) {
            const existingToast = document.getElementById('custom-toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.id = 'custom-toast';
            toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-vovinam-yellow text-slate-950 px-5 py-2.5 rounded-full font-bold text-xs shadow-2xl z-50 flex items-center gap-2 border border-white/40 transition-all duration-300';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-slate-900"></i> ${message}`;
            
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
